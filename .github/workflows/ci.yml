name: Jekyll CI
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Setup Pages
        id: configure-pages
        uses: actions/configure-pages@v6
        with:
          enablement: ${{ github.event_name != 'pull_request' }}
      - name: Setup CI config
        run: |
          echo "---" > _config_ci.yml
          echo "url: https://conferences.i-cav.org" >> _config_ci.yml
          echo "baseurl: /2027" >> _config_ci.yml
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --future --config _config.yml,_config_ci.yml
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://conferences.i-cav.org/2027/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
