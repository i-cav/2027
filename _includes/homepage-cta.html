<section class="homepage-cta" aria-label="Priority actions">
  <a class="homepage-cta__item topic-authors" href="{{ '/cfp/' | relative_url }}">
    <span class="homepage-cta__icon" aria-hidden="true">
      <i class="fa-solid fa-file-lines"></i>
    </span>
    <span class="homepage-cta__content">
      <span class="homepage-cta__title">Call for Papers</span>
      <span class="homepage-cta__note">
        Submission deadline
        <span class="homepage-cta__date">20 January 2027</span>
      </span>
    </span>
  </a>
  <a class="homepage-cta__item topic-attend" href="{{ '/registration/' | relative_url }}">
    <span class="homepage-cta__icon" aria-hidden="true">
      <i class="fa-solid fa-ticket"></i>
    </span>
    <span class="homepage-cta__content">
      <span class="homepage-cta__title">Registration</span>
      <span class="homepage-cta__note">
        Early registration deadline
        <span class="homepage-cta__date">18 May 2027</span>
      </span>
    </span>
  </a>
  {% assign linkedin_url = site.social-network-links.linkedin %}
  {% if linkedin_url %}
    <a class="homepage-cta__item" href="{{ linkedin_url }}" rel="noreferrer">
      <span class="homepage-cta__icon" aria-hidden="true">
        <i class="fab fa-linkedin-in"></i>
      </span>
      <span class="homepage-cta__content">
        <span class="homepage-cta__title">Follow CAV on LinkedIn</span>
        <span class="homepage-cta__note">News and announcements</span>
      </span>
    </a>
  {% endif %}
</section>
